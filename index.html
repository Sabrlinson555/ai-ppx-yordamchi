<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPX Yordamchi</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
font-family:Arial,sans-serif;
background:#eef2f5;
margin:0;
padding:20px
}
.container{
max-width:700px;
margin:auto
}
h1{
text-align:center;
color:#123b5d
}
.card{
background:white;
padding:18px;
margin-top:15px;
border-radius:12px;
box-shadow:0 2px 8px #0002
}
textarea{
width:100%;
height:150px;
box-sizing:border-box;
padding:12px;
border:1px solid #bbb;
border-radius:8px;
font-size:16px
}
button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:8px;
background:#123b5d;
color:white;
font-size:16px
}
select{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #bbb;
border-radius:8px;
font-size:16px
}
.result{
background:#f4f7f9;
padding:12px;
border-radius:8px;
margin-top:10px;
white-space:pre-line
}
.stat{
display:flex;
justify-content:space-between;
padding:12px;
margin-top:8px;
background:#f1f5f8;
border-radius:8px
}
.big{
font-size:30px;
font-weight:bold;
color:#123b5d;
text-align:center
}
.alert{
padding:14px;
margin-top:10px;
border-radius:8px;
background:#fff3cd
}
.success{
padding:14px;
margin-top:10px;
border-radius:8px;
background:#d1e7dd
}
#map{
height:400px;
width:100%;
border-radius:10px;
margin-top:12px
}
</style>
</head>

<body>

<div class="container">

<h1>🛡️ PPX YORDAMCHI</h1>

<div class="card">

<h3>📝 Voqea ma'lumotini kiriting</h3>

<textarea id="text"
placeholder="Masalan: 13-sentabr kuni soat 21:30 da markaziy ko‘chada ikki fuqaro janjallashayotgan edi. Xodimlar yetib borib, fuqarolarni ajratdi va tushuntirish berdi."></textarea>

<button onclick="voiceInput()">
🎙️ OVOZ ORQALI KIRITISH
</button>

<button onclick="analyze()">
🤖 AI TAHLIL QILISH
</button>

<button onclick="control()">
🛡️ AI NAZORAT
</button>

</div>


<div class="card">

<h3>📋 AI TAHLIL NATIJASI</h3>

<div id="result" class="result">
Hozircha ma'lumot yo‘q.
</div>

</div>


<div class="card">

<h3>📊 AI TAHLIL / STATISTIKA</h3>

<button onclick="addReport()">
➕ QAYDNI STATISTIKAGA QO‘SHISH
</button>

<button onclick="showStats()">
📊 STATISTIKANI KO‘RISH
</button>

<div id="stats" class="result">
Hozircha statistika yo‘q.
</div>

</div>


<div class="card">

<h3>🗺️ HAQIQIY HODISALAR XARITASI</h3>

<select id="filter" onchange="showMap()">
<option value="all">🔎 Barcha hodisalar</option>
<option value="Janjal">🚨 Janjal</option>
<option value="O‘g‘rilik">🔴 O‘g‘rilik</option>
<option value="Yo‘l-transport hodisasi">🚗 YTH</option>
<option value="Mast holat">🍺 Mast holat</option>
<option value="Bezorilik">⚠️ Bezorilik</option>
<option value="Boshqa hodisa">📌 Boshqa</option>
</select>

<button onclick="showMap()">
🗺️ XARITANI YANGILASH
</button>

<div id="map"></div>

<div id="mapInfo" class="result">
Xaritani ochish uchun tugmani bosing.
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

let map=null;


/* OVOZ */

function voiceInput(){

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Brauzeringiz ovozli kiritishni qo‘llab-quvvatlamaydi.");

return;
}

const recognition=new SpeechRecognition();

recognition.lang="uz-UZ";
recognition.interimResults=false;

recognition.onstart=function(){

document.getElementById("result").innerText=
"🎙️ Tinglayapman...";

};

recognition.onresult=function(event){

const text=
event.results[0][0].transcript;

document.getElementById("text").value=text;

document.getElementById("result").innerText=
"✅ Ovoz matnga aylantirildi.";

};

recognition.onerror=function(){

document.getElementById("result").innerText=
"❌ Ovozli kiritishda xatolik.";

};

recognition.start();

}


/* HODISA TURI */

function detectType(text){

text=text.toLowerCase();

if(
text.includes("janjal")||
text.includes("urush")||
text.includes("mushtlash")
)
return "Janjal";

if(
text.includes("o‘g‘ri")||
text.includes("o'g'ri")||
text.includes("o‘g‘rilik")||
text.includes("o'g'rilik")
)
return "O‘g‘rilik";

if(
text.includes("avariya")||
text.includes("yth")||
text.includes("yo‘l-transport")||
text.includes("yo'l-transport")
)
return "Yo‘l-transport hodisasi";

if(
text.includes("mast")||
text.includes("spirtli")
)
return "Mast holat";

if(
text.includes("bezorilik")||
text.includes("bezori")
)
return "Bezorilik";

return "Boshqa hodisa";

}


/* JOY */

function detectPlace(text){

const places=[
"markaziy ko‘cha",
"markaziy ko'cha",
"ko‘cha",
"ko'cha",
"mahalla",
"bozor",
"bekat",
"maktab",
"do‘kon",
"do'kon",
"park"
];

for(let p of places){

if(text.toLowerCase().includes(p))
return p;

}

return "Noma'lum joy";

}


/* TAHLIL */

function analyze(){

const text=
document.getElementById("text").value.trim();

if(!text){

alert("Avval voqea haqida ma'lumot kiriting.");

return;
}

let date="Aniqlanmadi";
let time="Aniqlanmadi";

const dateMatch=
text.match(
/(\d{1,2})[-\s](sentabr|sentyabr|oktabr|noyabr|dekabr|yanvar|fevral|mart|aprel|may|iyun|iyul|avgust)/i
);

if(dateMatch)
date=dateMatch[0];

const timeMatch=
text.match(/soat\s*(\d{1,2}[:.]\d{2})/i);

if(timeMatch)
time=timeMatch[1].replace(".",":");

const type=detectType(text);
const place=detectPlace(text);

document.getElementById("result").innerText=

`📅 Sana: ${date}

⏰ Vaqt: ${time}

📍 Joy: ${place}

🚨 Hodisa turi: ${type}

📝 Qayd:
${text}`;

}


/* NAZORAT */

function control(){

const text=
document.getElementById("text").value.trim();

if(!text){

alert("Avval ma'lumot kiriting.");

return;
}

let warnings=[];

if(
!/soat\s*\d{1,2}[:.]\d{2}/i.test(text)
)
warnings.push("⏰ Vaqt aniq ko‘rsatilmagan.");

if(
detectPlace(text)==="Noma'lum joy"
)
warnings.push("📍 Hodisa joyi aniq ko‘rsatilmagan.");

if(
!text.toLowerCase().includes("xodim") &&
!text.toLowerCase().includes("patrul")
)
warnings.push("👮 Xodimning harakati ko‘rsatilmagan.");

if(warnings.length===0){

document.getElementById("result").innerHTML=

`<div class="success">

🛡️ <b>AI NAZORAT NATIJASI</b>

<br><br>

✅ Qayd asosiy tekshiruvlardan o‘tdi.

<br><br>

Majburiy maydonlarda aniq kamchilik topilmadi.

</div>`;

}else{

document.getElementById("result").innerHTML=

`<div class="alert">

🛡️ <b>AI NAZORAT NATIJASI</b>

<br><br>

⚠️ Aniqlangan kamchiliklar:

<br><br>

${warnings.join("<br>")}

</div>`;

}

}


/* GPS BILAN SAQLASH */

function addReport(){

const text=
document.getElementById("text").value.trim();

if(!text){

alert("Avval voqea ma'lumotini kiriting.");

return;
}

if(!navigator.geolocation){

alert("Telefoningiz GPS funksiyasini qo‘llab-quvvatlamaydi.");

return;
}

document.getElementById("result").innerText=
"📍 GPS orqali joylashuv aniqlanmoqda...";

navigator.geolocation.getCurrentPosition(

function(position){

const lat=position.coords.latitude;
const lon=position.coords.longitude;

let reports=
JSON.parse(
localStorage.getItem("ppxReports")||"[]"
);

reports.push({

text:text,

type:detectType(text),

place:detectPlace(text),

lat:lat,

lon:lon,

savedAt:new Date().toLocaleString("uz-UZ")

});

localStorage.setItem(
"ppxReports",
JSON.stringify(reports)
);

document.getElementById("result").innerHTML=

`<div class="success">

✅ <b>Qayd saqlandi!</b>

<br><br>

📍 GPS joylashuvi ham saqlandi.

</div>`;

showMap();

},

function(){

document.getElementById("result").innerHTML=

`<div class="alert">

❌ GPS joylashuvini aniqlab bo‘lmadi.

<br><br>

Telefoningizda joylashuv xizmatini yoqing
va brauzerga joylashuvga ruxsat bering.

</div>`;

},

{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}

);

}


/* STATISTIKA */

function showStats(){

let reports=
JSON.parse(
localStorage.getItem("ppxReports")||"[]"
);

if(reports.length===0){

document.getElementById("stats").innerHTML=
"Hozircha statistika yo‘q.";

return;
}

let types={};
let places={};
let times={};

reports.forEach(report=>{

const type=
report.type||detectType(report.text);

const place=
report.place||detectPlace(report.text);

types[type]=(types[type]||0)+1;

places[place]=(places[place]||0)+1;

const timeMatch=
report.text.match(
/soat\s*(\d{1,2})[:.]\d{2}/i
);

if(timeMatch){

const hour=parseInt(timeMatch[1]);

times[hour]=(times[hour]||0)+1;

}

});

let typeHTML="";

Object.keys(types).forEach(type=>{

typeHTML+=`

<div class="stat">

<span>🚨 ${type}</span>

<b>${types[type]} ta</b>

</div>`;

});

let placeHTML="";

Object.keys(places).forEach(place=>{

placeHTML+=`

<div class="stat">

<span>📍 ${place}</span>

<b>${places[place]} ta</b>

</div>`;

});

document.getElementById("stats").innerHTML=

`

<div class="big">
${reports.length}
</div>

<p style="text-align:center">
Jami qaydlar
</p>

<hr>

<h4>🚨 Hodisalar bo‘yicha taqsimot</h4>

${typeHTML}

<h4>📍 JOY BO‘YICHA TAHLIL</h4>

${placeHTML}

`;

}


/* XARITA */

function showMap(){

let reports=
JSON.parse(
localStorage.getItem("ppxReports")||"[]"
);

if(!map){

map=L.map("map").setView(
[41.3111,69.2797],
11
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

}

let filter=
document.getElementById("filter").value;

let gpsReports=
reports.filter(function(report){

if(
report.lat===undefined||
report.lon===undefined
)
return false;

if(filter==="all")
return true;

return report.type===filter;

});


map.eachLayer(function(layer){

if(layer instanceof L.Marker)
map.removeLayer(layer);

});


if(gpsReports.length===0){

document.getElementById("mapInfo").innerHTML=
"📍 Tanlangan tur bo‘yicha GPS qayd topilmadi.";

setTimeout(function(){
map.invalidateSize();
},300);

return;
}


let bounds=[];

gpsReports.forEach(function(report){

let icon="📍";

if(report.type==="Janjal")
icon="🚨";

if(report.type==="O‘g‘rilik")
icon="🔴";

if(report.type==="Yo‘l-transport hodisasi")
icon="🚗";

if(report.type==="Mast holat")
icon="🍺";

if(report.type==="Bezorilik")
icon="⚠️";


const marker=
L.marker(
[
report.lat,
report.lon
]
).addTo(map);


marker.bindPopup(

`<b>${icon} ${report.type}</b>
<br><br>
📍 ${report.place}
<br>
🕐 ${report.savedAt}
<br><br>
📝 ${report.text}`

);

bounds.push(
[
report.lat,
report.lon
]
);

});


if(bounds.length===1){

map.setView(
bounds[0],
16
);

}else{

map.fitBounds(
bounds,
{
padding:[30,30]
}
);

}


document.getElementById("mapInfo").innerHTML=

`📍 Xaritada <b>${gpsReports.length}</b> ta tanlangan hodisa ko‘rsatilmoqda.`;

setTimeout(function(){

map.invalidateSize();

},300);

}

</script>

</body>
</html>
