<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPX Yordamchi</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #123b5d;
}

.card {
    background: white;
    padding: 18px;
    margin-top: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0002;
}

textarea {
    width: 100%;
    height: 150px;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #123b5d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0b2c46;
}

.result {
    background: #f4f7f9;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    white-space: pre-line;
}

.stat {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    margin-top: 8px;
    background: #f1f5f8;
    border-radius: 8px;
}

.big {
    font-size: 28px;
    font-weight: bold;
    color: #123b5d;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>🛡️ PPX YORDAMCHI</h1>

<div class="card">

<h3>📝 Voqea ma'lumotini kiriting</h3>

<textarea id="text"
placeholder="Masalan: 13-sentabr kuni soat 21:30 da markaziy ko‘chada ikki fuqaro janjallashayotgan edi. Xodimlar yetib borib, fuqarolarni ajratdi va tushuntirish berdi."></textarea>

<button onclick="voiceInput()">🎙️ OVOZ ORQALI KIRITISH</button>

<button onclick="analyze()">🤖 AI TAHLIL QILISH</button>

<button onclick="control()">🛡️ AI NAZORAT</button>

</div>

<div class="card">

<h3>📋 AI TAHLIL NATIJASI</h3>

<div id="result" class="result">
Hozircha ma'lumot yo‘q.
</div>

</div>

<div class="card">

<h3>📊 AI TAHLIL / STATISTIKA</h3>

<button onclick="addReport()">➕ QAYDNI STATISTIKAGA QO‘SHISH</button>

<button onclick="showStats()">📊 STATISTIKANI KO‘RISH</button>

<div id="stats" class="result">
Hozircha statistika yo‘q.
</div>

</div>

</div>

<script>

function voiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Brauzeringiz ovozli kiritishni qo‘llab-quvvatlamaydi.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "uz-UZ";
    recognition.interimResults = false;

    recognition.onstart = function() {
        document.getElementById("result").innerText =
            "🎙️ Tinglayapman...";
    };

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        document.getElementById("text").value = text;

        document.getElementById("result").innerText =
            "✅ Ovoz matnga aylantirildi.";
    };

    recognition.onerror = function() {

        document.getElementById("result").innerText =
            "❌ Ovozli kiritishda xatolik yuz berdi.";
    };

    recognition.start();
}


function analyze() {

    const text =
        document.getElementById("text").value.trim();

    if (!text) {
        alert("Avval voqea haqida ma'lumot kiriting.");
        return;
    }

    let date = "Aniqlanmadi";
    let time = "Aniqlanmadi";
    let place = "Aniqlanmadi";
    let type = "Boshqa hodisa";

    const dateMatch =
        text.match(/(\d{1,2})[-\s](sentabr|sentyabr|oktabr|noyabr|dekabr|yanvar|fevral|mart|aprel|may|iyun|iyul|avgust)/i);

    if (dateMatch) {
        date = dateMatch[0];
    }

    const timeMatch =
        text.match(/soat\s*(\d{1,2}[:.]\d{2})/i);

    if (timeMatch) {
        time = timeMatch[1].replace(".", ":");
    }

    const places = [
        "ko‘cha",
        "ko'cha",
        "mahalla",
        "bozor",
        "bekat",
        "uy",
        "maktab",
        "do‘kon",
        "do'kon",
        "park"
    ];

    for (let p of places) {
        if (text.toLowerCase().includes(p)) {
            place = p;
            break;
        }
    }

    if (
        text.toLowerCase().includes("janjal") ||
        text.toLowerCase().includes("urush")
    ) {
        type = "Janjal";
    }
    else if (
        text.toLowerCase().includes("o‘g‘ri") ||
        text.toLowerCase().includes("o'g'ri") ||
        text.toLowerCase().includes("o‘g‘rilik")
    ) {
        type = "O‘g‘rilik";
    }
    else if (
        text.toLowerCase().includes("avariya") ||
        text.toLowerCase().includes("yo‘l-transport")
    ) {
        type = "Yo‘l-transport hodisasi";
    }
    else if (
        text.toLowerCase().includes("mast")
    ) {
        type = "Mast holat";
    }

    const result =
`📅 Sana: ${date}
⏰ Vaqt: ${time}
📍 Joy: ${place}
🚨 Hodisa turi: ${type}

📝 Qayd:
${text}`;

    document.getElementById("result").innerText = result;
}


function control() {

    const text =
        document.getElementById("text").value.trim();

    if (!text) {
        alert("Avval ma'lumot kiriting.");
        return;
    }

    let warnings = [];

    if (!/soat\s*\d{1,2}[:.]\d{2}/i.test(text)) {
        warnings.push("⏰ Vaqt aniq ko‘rsatilmagan.");
    }

    if (
        !text.toLowerCase().includes("ko‘cha") &&
        !text.toLowerCase().includes("ko'cha") &&
        !text.toLowerCase().includes("mahalla") &&
        !text.toLowerCase().includes("bozor") &&
        !text.toLowerCase().includes("bekat")
    ) {
        warnings.push("📍 Hodisa joyi aniq ko‘rsatilmagan.");
    }

    if (
        !text.toLowerCase().includes("xodim") &&
        !text.toLowerCase().includes("patrul")
    ) {
        warnings.push("👮 Xodimning harakati ko‘rsatilmagan.");
    }

    document.getElementById("result").innerText =
        "🛡️ AI NAZORAT NATIJASI\n\n" +
        (warnings.length === 0
        ? "✅ Qayd asosiy tekshiruvlardan o‘tdi.\n\nMajburiy maydonlarda aniq kamchilik topilmadi."
        : "⚠️ Aniqlangan kamchiliklar:\n\n" +
          warnings.join("\n"));

}


function addReport() {

    const text =
        document.getElementById("text").value.trim();

    if (!text) {
        alert("Avval voqea ma'lumotini kiriting.");
        return;
    }

    let reports =
        JSON.parse(localStorage.getItem("ppxReports") || "[]");

    reports.push({
        text: text,
        date: new Date().toLocaleDateString("uz-UZ")
    });

    localStorage.setItem(
        "ppxReports",
        JSON.stringify(reports)
    );

    alert("✅ Qayd statistika bazasiga qo‘shildi.");

    showStats();
}


function showStats() {

    let reports =
        JSON.parse(localStorage.getItem("ppxReports") || "[]");

    if (reports.length === 0) {

        document.getElementById("stats").innerHTML =
            "Hozircha statistika yo‘q.";

        return;
    }

    let types = {};
    let times = {};

    reports.forEach(r => {

        const text = r.text.toLowerCase();

        let type = "Boshqa hodisa";

        if (
            text.includes("janjal") ||
            text.includes("urush")
        ) {
            type = "Janjal";
        }
        else if (
            text.includes("o‘g‘ri") ||
            text.includes("o'g'ri") ||
            text.includes("o‘g‘rilik")
        ) {
            type = "O‘g‘rilik";
        }
        else if (
            text.includes("avariya") ||
            text.includes("yo‘l-transport")
        ) {
            type = "Yo‘l-transport hodisasi";
        }
        else if (text.includes("mast")) {
            type = "Mast holat";
        }

        types[type] = (types[type] || 0) + 1;

        const timeMatch =
            text.match(/soat\s*(\d{1,2})[:.]\d{2}/i);

        if (timeMatch) {

            const hour = timeMatch[1];

            times[hour] =
                (times[hour] || 0) + 1;
        }

    });


    let typeHTML = "";

    Object.keys(types).forEach(type => {

        typeHTML += `
        <div class="stat">
            <span>🚨 ${type}</span>
            <b>${types[type]} ta</b>
        </div>
        `;

    });


    let busiestHour = "Aniqlanmadi";
    let max = 0;

    Object.keys(times).forEach(hour => {

        if (times[hour] > max) {

            max = times[hour];
            busiestHour = hour + ":00 atrofida";

        }

    });


    document.getElementById("stats").innerHTML = `

        <div class="big">${reports.length}</div>

        <p style="text-align:center;">
        Jami qaydlar
        </p>

        <hr>

        <h4>🚨 Hodisalar turi</h4>

        ${typeHTML}

        <h4>⏰ Eng ko‘p qayd tushgan vaqt</h4>

        <div class="stat">
            <span>🕐 Vaqt</span>
            <b>${busiestHour}</b>
        </div>

        <p>
        ⚠️ Statistika demo ma'lumotlar asosida ishlaydi.
        </p>
    `;

}

</script>

</body>
</html>
